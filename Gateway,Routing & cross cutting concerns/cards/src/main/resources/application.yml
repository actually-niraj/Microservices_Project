server:
  port: 9000
spring:
  application:
    name: "cards"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8071/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: "unrestricted"
  info:
    env:
      enabled: true

# Removed invalid 'endpoints' section as it is not recognized by Spring Boot

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "Cards Service"
    description: "Service for managing user cards"
    version: 1.0.0
    title: "Cards Service API"
    termsOfService: "https://eazybank.com/terms"
    contact:
      name: "EazyBank Support"
      url: "https://eazybank.com/support"
      email: "support@eazybank.com"

logging:
  level:
    com:
      eazybytes:
        cards: DEBUG

