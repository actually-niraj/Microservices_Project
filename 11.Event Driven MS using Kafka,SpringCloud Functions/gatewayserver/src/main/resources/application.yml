# application.yml for Gateway Service
spring:
  application:
    name: "gatewayserver"
  config:
    import: "optional:configserver:http://localhost:8071/" 
  cloud:
     gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          httpclient:
            connect-timeout: 1000
            response-timeout: 2s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:7080/realms/master/protocol/openid-connect/certs"

  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 1s
      
management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:          # singular "endpoint", not "endpoints"
    gateway:
      access: "unrestricted"


  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Removed invalid 'endpoints' section as it is not recognized by Spring Boot

info:
  app:
    name: "GateWay Service"
    description: "Service for routing and API gateway functionality"
    version: 1.0.0
    title: "GateWay Service API"
    termsOfService: "https://eazybank.com/terms"
    contact:
      name: "EazyBank Support"
      url: "https://eazybank.com/support"
      email: "support@eazybank.com"


logging:
  level:
    com:
      eazybytes:
        gatewayserver: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
  
resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000

